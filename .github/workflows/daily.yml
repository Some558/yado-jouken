name: Daily data refresh

# JST 05:17 = UTC 20:17 (日本はDSTなし)
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: yadoshibori-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: "Fetch -> transform -> validate -> promote"
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          PYTHONPATH: pipeline
        run: |
          set -euo pipefail
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          python3 pipeline/fetch.py --mode daily --as-of "$AS_OF"
          python3 pipeline/transform.py --as-of "$AS_OF"
          python3 pipeline/validate.py
          rm -rf data/latest
          cp -R data/staged data/latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        run: |
          set -euo pipefail
          cd site
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CF API は長い日本語 commit message を弾くため SHA を明示渡し
          command: pages deploy site/dist --project-name=yado-jouken --branch=main --commit-message="${{ github.sha }}" --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: "Commit data/latest (fail-closed: only after validate+deploy)"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          printf '%s\n' "$AS_OF" > site/.data-asof
          git add data/latest/ site/.data-asof
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data: daily refresh ${AS_OF}"
            git push
          fi

      - name: Slack success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then echo "SLACK_WEBHOOK_URL未設定"; exit 1; fi
          # hostのみ診断（URL本体は出さない）
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["SLACK_WEBHOOK_URL"])
          print(f"slack_host={u.hostname!r} scheme={u.scheme!r} path_ok={bool(u.path and len(u.path)>10)}")
          PY
          curl -sfS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ ヤドシボリ日次更新: ${AS_OF} 完了 (data+Pages)\"}"
          echo "slack_ok"

      - name: Slack failure (前日データ維持)
        if: failure()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then echo "SLACK_WEBHOOK_URL未設定"; exit 0; fi
          curl -sfS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"🔴 ヤドシボリ日次更新: ${AS_OF} エラー (前日データ維持)\"}"
          echo "slack_ok"
