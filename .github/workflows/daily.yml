name: Daily data refresh

# JST 05:17 = UTC 20:17 (日本はDSTなし)
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yadoshibori-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: "Fetch -> transform -> validate -> promote"
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          PYTHONPATH: pipeline
        run: |
          set -euo pipefail
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          python3 pipeline/fetch.py --mode daily --as-of "$AS_OF"
          python3 pipeline/transform.py --as-of "$AS_OF"
          python3 pipeline/validate.py
          rm -rf data/latest
          cp -R data/staged data/latest

      - name: "Commit data/latest (fail-closed: only after validate)"
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          echo "as_of=${AS_OF}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$AS_OF" > site/.data-asof
          git add data/latest/ site/.data-asof
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no data changes"
          else
            git commit -m "data: daily refresh ${AS_OF}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # wrangler OAuth は短命で schedule 実行が落ちるため、Deploy Hook で Git ビルドを発火する
      - name: Trigger Cloudflare Pages Deploy Hook
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
          AS_OF: ${{ steps.commit.outputs.as_of }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK_URL:-}" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL 未設定" >&2
            exit 1
          fi
          curl -sfS -X POST "$HOOK_URL" | tee /tmp/hook.json
          echo
          # 本番反映待ち（最大6分）
          for i in $(seq 1 36); do
            if curl -sfS "https://yadoshibori.com/?t=$(date +%s)" | grep -q "データ取得日 ${AS_OF}"; then
              echo "live_ok as_of=${AS_OF} attempt=${i}"
              exit 0
            fi
            echo "waiting live as_of=${AS_OF} attempt=${i}"
            sleep 10
          done
          echo "timeout: live site did not show ${AS_OF}" >&2
          exit 1

      - name: Slack success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then echo "SLACK_WEBHOOK_URL未設定"; exit 1; fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["SLACK_WEBHOOK_URL"])
          print(f"slack_host={u.hostname!r} scheme={u.scheme!r} path_ok={bool(u.path and len(u.path)>10)}")
          PY
          curl -sfS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ ヤドシボリ日次更新: ${AS_OF} 完了 (data+Pages)\"}"
          echo "slack_ok"

      - name: Slack failure (前日データ維持)
        if: failure()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          AS_OF=$(TZ=Asia/Tokyo date +%F)
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then echo "SLACK_WEBHOOK_URL未設定"; exit 0; fi
          curl -sfS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"🔴 ヤドシボリ日次更新: ${AS_OF} エラー (前日データ維持)\"}"
          echo "slack_ok"
