name: Static site build validation

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify patched Node runtime
        run: node -e "if (process.versions.node !== '22.23.4') throw new Error(process.version); console.log(process.version)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: site
      - run: npm run build
        working-directory: site
